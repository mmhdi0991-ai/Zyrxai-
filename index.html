<html lang="en" dir="ltr" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#1b0610">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fh:Cinzel,Vazirmatn,Georgia,serif;--fu:Manrope,Vazirmatn,system-ui,sans-serif;--ac:#3b82f6;--fs:16px;--bg:#5B1024;--card:#111831;--line:#1f2a52;--tx:#eaf0ff;--soft:#8d9acb}
:root[data-t=light]{--bg:#F5F3EE;--card:#fff;--line:#e2e7f7;--tx:#0f1630;--soft:#68739a}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{font-size:var(--fs);background:var(--bg)}
body{font-family:var(--fu),Vazirmatn,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);line-height:1.6;background:radial-gradient(520px 260px at 50% -90px,color-mix(in srgb,var(--ac) 24%,var(--bg)),transparent) var(--bg) no-repeat}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#page{flex:1;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 16px}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1.7rem;font-weight:800;color:var(--ac);letter-spacing:-.04em}
.avatar{width:2.6rem;height:2.6rem;border-radius:50%;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));display:grid;place-items:center;font-weight:800;color:#fff;box-shadow:0 0 22px color-mix(in srgb,var(--ac) 50%,transparent)}
h1{font-size:1.7rem;font-weight:800;margin:26px 0 16px;line-height:1.25;letter-spacing:-.03em}
h1 span,.sub{color:var(--soft);font-weight:500}
h2{font-size:1.05rem;font-weight:600;margin:28px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.ask{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 22px;color:var(--soft);text-align:left}
.go{flex:none;width:2.5rem;height:2.5rem;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats .card{padding:12px 14px}
.stats b{display:block;font-size:1.5rem;font-weight:800;line-height:1.2}
.stats small,.card small{color:var(--soft);font-size:.78rem}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.em{display:flex;justify-content:space-between;gap:6px}
.em button{flex:1;font-size:1.5rem;padding:8px 0;border-radius:16px;border:1px solid var(--line)}
.em button.on{background:color-mix(in srgb,var(--ac) 20%,transparent);border-color:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:8px;height:44px;margin-top:14px}
.bars i{flex:1;border-radius:6px;background:var(--line);min-height:5px}
.bars i.f{background:var(--ac)}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.t{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;align-items:center;gap:12px;font-weight:500;text-align:left}
.ic{width:2.6rem;height:2.6rem;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--ac)) 18%,transparent);color:var(--c,var(--ac))}
.row{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:10px;text-align:left}
.row .m{min-width:0;flex:1}
.row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--soft);font-size:.8rem}
.sw{flex:none;width:3rem;height:1.8rem;border-radius:1rem;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:var(--ac)}
.sw[aria-checked=true]::after{transform:translateX(1.2rem)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:11px;font-size:.88rem;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--ac);color:#fff;font-weight:600}
.lbl{display:block;font-size:.82rem;color:var(--soft);margin:16px 0 8px}
.sw8{display:flex;gap:12px;flex-wrap:wrap}
.sw8 button{width:2.1rem;height:2.1rem;border-radius:50%;background:var(--c)}
.sw8 button[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
input.name{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--tx);font:inherit}
.danger{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);color:#f87171;font-weight:500}
.sp{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 28%,var(--card)),var(--card));border:1px solid var(--line);border-radius:24px;margin-top:6px}
.sp .avatar{width:3.4rem;height:3.4rem;font-size:1.3rem}
.sp b{display:block;font-size:1.15rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp small{color:var(--soft);font-size:.82rem}
.sec{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:24px 6px 8px;font-weight:600}
.grp{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.it{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .m{flex:1;min-width:0}.it .m b{display:block;font-weight:500}.it .m small{display:block;color:var(--soft);font-size:.8rem}
.it.col{flex-direction:column;align-items:stretch;gap:10px}
.it .ic{width:2.2rem;height:2.2rem;border-radius:12px}
.it .lbl{margin:0}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:16px;border:1px solid var(--line);font-size:.8rem;color:var(--soft);transition:all .15s}
.modes button span{font-size:1.4rem}
.modes button[aria-pressed=true]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--tx);font-weight:600}
.prev{border-radius:18px;padding:14px;background:var(--bg);border:1px solid var(--line)}
.prev .q{margin-inline-start:auto;max-width:75%;background:var(--ac);color:#fff;border-radius:16px 16px 4px 16px;padding:8px 12px;font-size:.9rem;width:fit-content}
.prev .r{max-width:80%;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:.9rem;margin-top:8px;width:fit-content}
input[type=range]{width:100%;accent-color:var(--ac)}
.cc{position:relative;width:2.1rem;height:2.1rem;border-radius:50%;background:conic-gradient(#ef4444,#f59e0b,#84cc16,#06b6d4,#3b82f6,#a855f7,#ef4444);overflow:hidden;display:block}
.cc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ghost{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);font-weight:500}
:root[data-r=sq] .card,:root[data-r=sq] .row,:root[data-r=sq] .t,:root[data-r=sq] .grp,:root[data-r=sq] .sp,:root[data-r=sq] .ask{border-radius:10px}
.ver{text-align:center;color:var(--soft);font-size:.78rem;margin:22px 0 6px}
.none{color:var(--soft);text-align:center;padding:30px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--ac);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.9rem}
#nav{display:flex;gap:4px;margin:0 12px calc(10px + env(safe-area-inset-bottom,0px));padding:6px;background:var(--card);border:1px solid var(--line);border-radius:26px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;border-radius:20px;font-size:.72rem;color:var(--soft)}
#nav button[aria-current=page]{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);font-weight:600}
/* chat */
#chat header{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px}
#chat h3{font-size:1rem;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.ib{width:2.6rem;height:2.6rem;border-radius:14px;display:grid;place-items:center}
.ib:active{background:var(--card)}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 18px}
.u{display:flex;justify-content:flex-end;margin:14px 0}
.ub{max-width:85%;background:var(--ac);color:#fff;border-radius:22px 22px 6px 22px;padding:8px 16px;white-space:pre-wrap;word-break:break-word}
.a{margin:14px 0}
.body{word-break:break-word}
.body ul{padding-inline-start:22px;margin:6px 0}
.body code{background:var(--card);border-radius:6px;padding:1px 6px;font-size:.88em}
.body pre{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;overflow-x:auto;font-size:.85rem;line-height:1.7}
.body pre code{background:none;padding:0}
.cp{color:var(--soft);padding:2px;border-radius:8px}
.cp svg.i{width:1.05rem;height:1.05rem}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ac);animation:p 1s ease-in-out infinite;margin:12px 4px}
@keyframes p{50%{transform:scale(.6);opacity:.5}}
footer{padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.box{background:var(--card);border:1px solid var(--line);border-radius:26px;display:flex;align-items:flex-end;gap:6px;padding:6px 6px 6px 8px}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;max-height:150px;padding:8px 12px;line-height:1.6}
textarea::placeholder{color:var(--soft)}
#send:disabled{opacity:.3}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:6px 16px;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#pend{display:flex;gap:10px;flex-wrap:wrap;padding:0 4px 8px}
#pend>div{position:relative}
.th{width:3.4rem;height:3.4rem;border-radius:12px;object-fit:cover;display:block}
.fl{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.82rem;max-width:12rem}
.fl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{position:absolute;top:-6px;right:-6px;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--tx);color:var(--bg);font-size:.85rem;line-height:1.3rem;text-align:center}
.ub .th{width:9rem;height:9rem;margin-bottom:6px}
.ub .fl{background:rgba(255,255,255,.2);border-color:transparent;color:#fff;margin-bottom:6px}
.gen{max-width:100%;border-radius:16px;margin-top:8px;display:block}
#rqb{display:flex;gap:8px;align-items:center;margin:0 4px 8px;padding:6px 10px;border-inline-start:3px solid var(--ac);background:rgba(127,127,127,.12);border-radius:8px;font-size:13px;color:var(--soft)}#rqb span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#rqb[hidden]{display:none}.qt{font-size:13px;opacity:.85;border-inline-start:3px solid rgba(255,255,255,.6);padding:2px 8px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:2px;margin-top:2px}
.tr{border-inline-start:3px solid var(--ac);padding:2px 12px;margin-top:8px;color:var(--soft)}
.play{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;margin-top:8px}
#sheet{display:flex;gap:10px;padding:0 4px 10px}
#sheet button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 0;font-size:.82rem}
#recbar{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px}
.rd{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:p 1s ease-in-out infinite}
#mic.rec{background:#ef4444;color:#fff}
#hint{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
#hint h4{grid-column:1/-1;font-size:1.35rem;font-weight:800;margin:26px 0 4px;letter-spacing:-.02em}
#hint button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;font-size:.9rem;font-weight:500}
.hn{grid-column:1/-1;color:var(--soft);font-size:.82rem}
.seg.w{flex-wrap:wrap}.seg.w button{flex:1 0 30%}
select.name{appearance:none}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.sw,.sw::after,#toast{transition:none}}
.tdots{display:flex;gap:5px;padding:14px 6px}.tdots i{width:8px;height:8px;border-radius:50%;background:var(--soft);animation:wv 1.2s ease-in-out infinite}.tdots i:nth-child(2){animation-delay:.15s}.tdots i:nth-child(3){animation-delay:.3s}@keyframes wv{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.gph{width:min(280px,100%);margin:8px 0}.gc{position:relative;aspect-ratio:2/3;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.gc::before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 30% 30%,var(--ac),transparent 45%),radial-gradient(circle at 75% 35%,#a855f7,transparent 42%),radial-gradient(circle at 50% 80%,#ec4899,transparent 45%);filter:blur(28px);opacity:.5;will-change:transform;animation:bl 7s ease-in-out infinite alternate}
.gc::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-100%);will-change:transform;animation:sh 1.8s ease-in-out infinite}
.gc svg{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;color:#fff;z-index:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3));animation:sp 1.6s ease-in-out infinite}
@keyframes bl{to{transform:translate(8%,-6%) rotate(25deg) scale(1.15)}}@keyframes sh{to{transform:translateX(100%)}}@keyframes sp{50%{transform:scale(1.25) rotate(12deg);opacity:.7}}
.gt{margin-top:10px;font-size:.88rem;color:var(--soft);transition:opacity .2s}.gb{height:3px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden;position:relative}.gb::after{content:"";position:absolute;inset:0;width:40%;background:var(--ac);border-radius:3px;animation:ib 1.4s ease-in-out infinite}@keyframes ib{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.gen{cursor:zoom-in}.gen.rv{animation:rv .75s cubic-bezier(.2,.7,.2,1) both}@keyframes rv{from{filter:blur(12px);opacity:0;transform:scale(.97)}to{filter:none;opacity:1;transform:none}}
#lb{position:fixed;inset:0;z-index:50;background:rgba(5,8,20,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .22s}#lb.on{opacity:1}
#lbi{max-width:96vw;max-height:82vh;border-radius:14px;transform:scale(.92);transition:transform .25s cubic-bezier(.2,.8,.2,1)}#lb.on #lbi{transform:none}
#lbx,#lbd{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}#lbx{inset-inline-start:14px}#lbd{inset-inline-end:14px}
@media (prefers-reduced-motion:reduce){.tdots i,.gc::before,.gc::after,.gc svg,.gb::after,.gen.rv{animation:none}}
#lg{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}#lg h2{font-size:1.4rem}#lg p{color:var(--soft);max-width:300px}
.em button{color:var(--soft)}.em button.on{color:var(--ac)}.em button svg.i{width:1.7rem;height:1.7rem}

/* ===== Luxury layer: obsidian, titanium and champagne ===== */
:root{
  --bg:#5B1024; --card:#6A1A30; --line:rgba(255,255,255,.12);
  --tx:#FBEFF0; --soft:#D9A9B3; --ac:#E3B9A6;
  --hair:rgba(255,255,255,.06); --ease:cubic-bezier(.2,.7,.2,1);
}
:root[data-t=light]{
  --bg:#F5F3EE; --card:#FFFFFF; --line:rgba(20,18,14,.08);
  --tx:#141414; --soft:#77736B; --ac:#8A6E4B;
}
html{background:var(--bg)}
body{
  font-family:"Inter","Vazirmatn",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  letter-spacing:-.011em; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  background:var(--bg) !important;
}
:lang(fa), :lang(fa) *{font-family:"Vazirmatn","Inter",system-ui,sans-serif; letter-spacing:0}
svg.i{stroke-width:1.35}
h1{font-size:2rem;font-weight:600;letter-spacing:-.035em;line-height:1.12;margin:30px 0 18px}
h2{font-size:.78rem;font-weight:500;letter-spacing:.02em;color:var(--soft);margin:30px 0 12px}
.logo{font-size:1.25rem;font-weight:600;letter-spacing:-.03em;color:var(--tx)}
.avatar{
  background:var(--card); color:var(--tx); box-shadow:none;
  border:1px solid var(--line); font-weight:500; font-size:.9rem;
}
.sub,h1 span{color:var(--soft)}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:24px;
  box-shadow:inset 0 1px 0 var(--hair);
}
.ask{
  background:var(--card); border:1px solid var(--line); border-radius:999px;
  box-shadow:inset 0 1px 0 var(--hair); padding:7px 7px 7px 22px;
}
.go{
  background:var(--tx); color:var(--bg); box-shadow:none;
}
.go svg{color:var(--bg)}
:root[data-t=light] .go{background:var(--tx);color:#fff}
button{transition:transform .18s var(--ease), opacity .18s var(--ease), background-color .2s var(--ease)}
button:active{transform:scale(.96);opacity:.82}
nav{
  background:color-mix(in srgb, var(--card) 78%, transparent) !important;
  -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px);
  border-top:1px solid var(--line) !important; box-shadow:none !important;
}
#sheet{
  background:color-mix(in srgb, var(--card) 92%, transparent) !important;
  -webkit-backdrop-filter:blur(28px); backdrop-filter:blur(28px);
  border:1px solid var(--line); border-radius:30px 30px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.25);
}
#toast{
  background:var(--tx) !important; color:var(--bg) !important;
  border-radius:999px !important; box-shadow:0 10px 30px rgba(0,0,0,.25) !important;
  font-size:.85rem; font-weight:500; border:0 !important;
}
::selection{background:color-mix(in srgb, var(--ac) 35%, transparent)}
#page{scrollbar-width:none}
#page::-webkit-scrollbar{display:none}
input,textarea{font:inherit;color:var(--tx);background:transparent;border:0;outline:none}
input::placeholder,textarea::placeholder{color:var(--soft);opacity:.8}
@media (prefers-reduced-motion:reduce){
  button{transition:none}
  button:active{transform:none}
}

.logo{font-family:var(--fh);font-weight:600;font-size:15px;letter-spacing:.2em;color:var(--tx);display:flex;align-items:center;gap:10px}
.seal{width:28px;height:28px;border-radius:50%;border:1px solid var(--ac);display:inline-flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:600;font-size:12px;color:var(--ac);flex:none;letter-spacing:0}

  const t=k=>(faL()?TX.fa:TX.en)[k]||"";
  const ICON_MIC='<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>';
  const ICON_OFF='<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3M4 4l16 16"/></svg>';
  const ICON_X='<svg class="i" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const SIL="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
  let R=null, rtBroken=false;

  const send=o=>{ try{ if(R&&R.dc&&R.dc.readyState==="open") R.dc.send(JSON.stringify(o)); }catch(e){} };
  function setS(s){
    if(!R) return; R.s=s;
    const m=R.muted&&(s==="listening"||s==="hearing");
    VM.dataset.s=m?"muted":(s==="connecting"?"thinking":s);
    stEl.textContent=m?t("muted"):t(s);
    if(s==="thinking"||s==="connecting") orb.style.setProperty("--lv","0");
    try{ if(tg&&tg.HapticFeedback&&(s==="hearing"||s==="speaking")&&S.haptic!==0) tg.HapticFeedback.impactOccurred("light"); }catch(e){}
  }
  const rmsOf=(an,buf)=>{ if(!an) return 0; an.getFloatTimeDomainData(buf); let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i]; return Math.sqrt(s/buf.length); };
  function lvSet(v){ R.lv=R.lv*.6+v*.4; orb.style.setProperty("--lv",Math.min(1,R.lv).toFixed(3)); }
  function levelTick(){
    if(!R||R.closed) return;
    const now=performance.now();
    if(R.s==="speaking"){
      const r=rmsOf(R.anR,R.bufR);
      if(r>.004) R.lastSound=now;
      lvSet(r>.003?r*9:.25+.35*Math.abs(Math.sin(now/160))*Math.abs(Math.sin(now/410)));
      if(R.respDone&&now-R.lastSound>2000) setS("listening");
    } else if(R.s==="listening"||R.s==="hearing"){
      lvSet(R.muted?0:rmsOf(R.anL,R.bufL)*8);
    }
  }

  function commit(tn){
    if(!tn||tn.done) return; tn.done=true;
    if(!tn.u&&!tn.a) return;
    const chat=tn.chat;
    if(!chats.includes(chat)) chats.unshift(chat);
    if(!chat.title) chat.title=(tn.u||tn.a).slice(0,40);
    if(tn.u) chat.msgs.push({role:"user",text:tn.u,att:[]});
    if(tn.a) chat.msgs.push({role:"assistant",text:tn.a});
    chat.ts=Date.now(); saveC();
  }

  function onEv(e){
    if(!R||R.closed||!e) return;
    switch(e.type){
      case "input_audio_buffer.speech_started": {
        const tn={id:e.item_id,u:"",a:"",p:"",aDone:false,done:false,chat:R.chat};
        R.turns.push(tn); R.byId[e.item_id]=tn; R.cur=tn;
        uEl.textContent=""; aEl.textContent=""; setS("hearing"); break;
      }
      case "input_audio_buffer.speech_stopped": setS("thinking"); break;
      case "conversation.item.input_audio_transcription.delta": {
        const tn=R.byId[e.item_id]; if(tn){ tn.p+=(e.delta||""); if(R.cur===tn) uEl.textContent=tn.p; } break;
      }
      case "conversation.item.input_audio_transcription.completed": {
        const tn=R.byId[e.item_id], tx=String(e.transcript||"").trim();
        if(tn){ tn.u=tx; if(R.cur===tn) uEl.textContent=tx; if(tn.aDone) commit(tn); } break;
      }
      case "response.created":
        if(R.s!=="hearing") setS("thinking");
        R.aTn=R.cur; R.aBuf=""; R.respDone=false; aEl.textContent=""; break;
      case "response.output_audio_transcript.delta":
      case "response.audio_transcript.delta":
        R.aBuf+=(e.delta||""); aEl.textContent=R.aBuf; break;
      case "response.output_audio_transcript.done":
      case "response.audio_transcript.done":
        if(e.transcript) R.aBuf=e.transcript; aEl.textContent=R.aBuf; break;
      case "output_audio_buffer.started": R.lastSound=performance.now(); setS("speaking"); break;
      case "output_audio_buffer.stopped":
      case "output_audio_buffer.cleared": if(R.s==="speaking") setS("listening"); break;
      case "response.done": {
        R.respDone=true; const tn=R.aTn;
        if(tn){ tn.a=String(R.aBuf||"").trim(); tn.aDone=true; if(tn.u) commit(tn); else setTimeout(()=>commit(tn),2500); }
        if(R.s==="thinking") setS("listening"); break;
      }
      case "error": console.warn(e); if(e.error&&e.error.message) toast(String(e.error.message).slice(0,80)); break;
    }
  }

  function rtOrb(){ if(R&&R.s==="speaking"){ send({type:"response.cancel"}); send({type:"output_audio_buffer.clear"}); setS("listening"); } }
  function rtMute(){
    if(!R||!R.ms) return;
    R.muted=!R.muted; mBtn.classList.toggle("off",R.muted); mBtn.innerHTML=R.muted?ICON_OFF:ICON_MIC;
    R.ms.getAudioTracks().forEach(x=>{ x.enabled=!R.muted; }); setS(R.s);
  }
  function rtClose(){
    if(!R) return; const r=R;
    try{ r.turns.forEach(commit); }catch(e){}
    r.closed=true; clearInterval(r.timer); clearTimeout(r.maxT); clearTimeout(r.wd);
    try{ if(r.dc) r.dc.close(); }catch(e){}
    try{ if(r.pc) r.pc.close(); }catch(e){}
    if(r.ms) r.ms.getTracks().forEach(x=>x.stop());
    if(r.ctx){ try{ r.ctx.close(); }catch(e){} }
    try{ r.au.pause(); r.au.srcObject=null; }catch(e){}
    if(r.wl){ try{ r.wl.release(); }catch(e){} }
    try{ if(tg&&tg.enableVerticalSwipes) tg.enableVerticalSwipes(); }catch(e){}
    VM.hidden=true; R=null; orb.style.setProperty("--lv","0");
    try{ if(cur){ draw(); down(); } }catch(e){}
  }

  function fallback(){
    orb.onclick=classic.orb; mBtn.onclick=classic.m; xBtn.onclick=classic.x;
    classic.open();
  }

  async function connect(rt){
    const pc=new RTCPeerConnection(); R.pc=pc;
    pc.ontrack=e=>{
      if(!R||R.closed) return;
      const st=(e.streams&&e.streams[0])||new MediaStream([e.track]);
      R.au.srcObject=st; const p=R.au.play(); if(p&&p.catch) p.catch(()=>{});
      if(R.ctx){ try{ const an=R.ctx.createAnalyser(); an.fftSize=1024; R.ctx.createMediaStreamSource(st).connect(an); R.anR=an; R.bufR=new Float32Array(1024); }catch(x){} }
    };
    R.ms.getTracks().forEach(tr=>pc.addTrack(tr,R.ms));
    if(R.ctx){ try{ const an=R.ctx.createAnalyser(); an.fftSize=1024; R.ctx.createMediaStreamSource(R.ms).connect(an); R.anL=an; R.bufL=new Float32Array(1024); }catch(x){} }
    const dc=pc.createDataChannel("oai-events"); R.dc=dc;
    dc.onmessage=m=>{ try{ onEv(JSON.parse(m.data)); }catch(x){} };
    dc.onopen=()=>{ if(R&&R.s==="connecting") setS("listening"); };
    pc.onconnectionstatechange=()=>{
      if(!R||R.closed) return; const s=pc.connectionState;
      if(s==="failed"||s==="closed"){ toast(t("lost")); rtClose(); }
      else if(s==="disconnected") setTimeout(()=>{ if(R&&!R.closed&&pc.connectionState==="disconnected"){ toast(t("lost")); rtClose(); } },4000);
    };
    const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
    const r=await fetch("https://api.openai.com/v1/realtime/calls",{method:"POST",body:offer.sdp,headers:{"Authorization":"Bearer "+rt.key,"Content-Type":"application/sdp"}});
    if(!r.ok) throw new Error("sdp "+r.status);
    const ans=await r.text();
    if(!R||R.closed) return;
    await pc.setRemoteDescription({type:"answer",sdp:ans});
    R.timer=setInterval(levelTick,50);
    R.maxT=setTimeout(()=>{ toast(t("ended")); rtClose(); },(rt.maxSec||600)*1000);
    R.wd=setTimeout(()=>{ if(R&&!R.closed&&R.s==="connecting"){ rtBroken=true; rtClose(); toast(t("unavail")); fallback(); } },15000);
    try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(l=>{ if(R&&!R.closed) R.wl=l; else l.release(); }).catch(()=>{}); }catch(e){}
  }

  async function open(){
    if(R) return;
    if(busy) return toast("Please wait…");
    if(!cur) return;
    if(rtBroken||!(window.RTCPeerConnection&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)) return fallback();
    const chat=cur;
    const au=new Audio(); au.setAttribute("playsinline",""); au.autoplay=true;
    try{ au.src=SIL; const p=au.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
    let ctx=null; try{ const AC=window.AudioContext||window.webkitAudioContext; ctx=new AC(); if(ctx.resume) ctx.resume(); }catch(e){}
    R={chat,au,ctx,s:"connecting",muted:false,closed:false,turns:[],byId:{},lv:0,aBuf:"",cur:null,aTn:null,respDone:false,lastSound:0,ms:null};
    orb.onclick=rtOrb; mBtn.onclick=rtMute; xBtn.onclick=rtClose;
    mBtn.classList.remove("off"); mBtn.innerHTML=ICON_MIC; xBtn.innerHTML=ICON_X;
    uEl.textContent=""; aEl.textContent=""; VM.setAttribute("aria-label",t("label")); VM.hidden=false; setS("connecting");
    try{ if(tg&&tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }catch(e){}
    let ms;
    try{
      let late=false;
      const gp=navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      gp.then(s=>{ if(late) s.getTracks().forEach(x=>x.stop()); },()=>{});
      ms=await Promise.race([gp,new Promise((_,j)=>setTimeout(()=>{ late=true; j({name:"Timeout"}); },45000))]);
    }catch(e){ rtClose(); voiceHelp((e&&e.name)||""); return; }
    if(!R||R.closed||R.chat!==chat){ ms.getTracks().forEach(x=>x.stop()); return; }
    R.ms=ms;
    const hist=chat.msgs.slice(-10).map(m=>({role:m.role,text:m.text||""}));
    let res=null;
    try{ res=await api({message:"realtime",tool:"realtime",history:hist}); }catch(e){}
    if(!R||R.closed) return;
    if(!res||!res.rt||!res.rt.key){
      const blocked=!!(res&&res.reply&&res.rtError===undefined);
      rtClose();
      if(blocked){ toast(String(res.reply).slice(0,140)); return; }
      rtBroken=true; toast(t("unavail")); return fallback();
    }
    try{ await connect(res.rt); }
    catch(e){ console.warn(e); rtClose(); rtBroken=true; toast(t("unavail")); fallback(); }
  }

  window.openVoice=open; window.toggleRec=open;
  const mic=$("mic"); if(mic) mic.onclick=open;
})();

/* ===== In-app camera: live preview + shutter + flip + retake/use (Telegram WebView ignores <input capture>) ===== */
(function(){
  const CM=$("cam"); if(!CM) return;
  const V=$("camv"), P=$("camp"), SH=$("cams"), FL=$("camf"), CL=$("camx"), RT=$("camr"), US=$("camu");
  const faL=()=>{ const l=(S&&S.lang&&S.lang!=="auto")?S.lang:((u&&u.language_code)||""); return /^fa/i.test(l); };
  const TT={en:{retake:"Retake",use:"Use photo",err:"Camera isn't available here, opening the phone camera instead"},fa:{retake:"گرفتن دوباره",use:"استفاده از عکس",err:"دوربین داخلی در دسترس نیست؛ دوربین گوشی باز می‌شود"}};
  const t=k=>(faL()?TT.fa:TT.en)[k];
  let stream=null, facing="environment", shot=null, url=null, busyShot=false;
  function stopStream(){ if(stream){ stream.getTracks().forEach(x=>x.stop()); stream=null; } try{ V.srcObject=null; }catch(e){} }
  function clearShot(){ if(url){ try{ URL.revokeObjectURL(url); }catch(e){} url=null; } shot=null; P.removeAttribute("src"); }
  const setMode=m=>{ CM.dataset.m=m; };
  async function start(){
    stopStream();
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
      V.srcObject=stream; V.style.transform=facing==="user"?"scaleX(-1)":"none";
      const p=V.play(); if(p&&p.catch) await p.catch(()=>{});
      return true;
    }catch(e){ stopStream(); return false; }
  }
  function close(){
    stopStream(); clearShot(); CM.hidden=true; setMode("live");
    try{ if(tg&&tg.enableVerticalSwipes) tg.enableVerticalSwipes(); }catch(e){}
  }
  async function open(){
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)) return $("fCam").click();
    clearShot(); setMode("live"); CM.hidden=false;
    try{ if(tg&&tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }catch(e){}
    const ok=await start();
    if(!ok){ close(); toast(t("err")); $("fCam").click(); }
  }
  function snap(){
    if(busyShot||!stream||!V.videoWidth) return; busyShot=true;
    const w0=V.videoWidth, h0=V.videoHeight, k=Math.min(1,1920/Math.max(w0,h0));
    const c=document.createElement("canvas"); c.width=Math.round(w0*k); c.height=Math.round(h0*k);
    c.getContext("2d").drawImage(V,0,0,c.width,c.height);
    c.toBlob(b=>{
      busyShot=false; if(!b) return toast("Couldn't take the photo");
      shot=b; url=URL.createObjectURL(b); P.src=url; setMode("review");
      try{ if(tg&&tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium"); }catch(e){}
    },"image/jpeg",.92);
  }
  SH.onclick=snap; CL.onclick=close;
  FL.onclick=async()=>{ facing=facing==="user"?"environment":"user"; if(!(await start())) toast(t("err")); };
  RT.onclick=()=>{ clearShot(); setMode("live"); };
  US.onclick=async()=>{ if(!shot) return; const f=new File([shot],"camera.jpg",{type:"image/jpeg"}); close(); await addFile(f); };
  RT.textContent=t("retake"); US.textContent=t("use");
  const old=$("sheet").onclick;
  $("sheet").onclick=e=>{
    const b=e.target.closest("[data-pick]");
    if(b&&b.dataset.pick==="fCam"){ $("sheet").hidden=true; open(); return; }
    if(old) old(e);
  };
  window.openCamera=open;
})();
</script>
